<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F9FF"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1D4ED8" flood-opacity="0.08"/></filter><style>.pulse{animation:p 3s ease-in-out infinite}@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}</style></defs><rect width="1200" height="700" rx="24" fill="url(#bg)"/><rect x="0.75" y="0.75" width="1198.5" height="698.5" rx="23.25" stroke="#BFDBFE" stroke-width="1.5"/><text x="52" y="58" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">HOW I THINK ABOUT SYSTEMS</text><text x="52" y="91" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="19">Useful systems do four things well: they observe, understand, act, and improve.</text><text x="52" y="119" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="1.1">SIGNALS → INTELLIGENCE → ACTION → FEEDBACK</text><g transform="translate(52 154)" filter="url(#shadow)"><rect width="530" height="190" rx="22" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><circle cx="34" cy="34" r="8" fill="#0F172A" class="pulse"/><text x="54" y="42" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">1. Signals</text><text x="26" y="78" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">Capture the inputs that describe what is happening.</text><text x="26" y="112" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="17">• Market, intent, product, and user events</text><text x="26" y="140" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="17">• Documents, web data, and internal records</text><text x="26" y="168" fill="#64748B" font-family="Inter,Arial,sans-serif" font-size="16">Scrape · Ingest · Enrich · Observe</text></g><g transform="translate(618 154)" filter="url(#shadow)"><rect width="530" height="190" rx="22" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/><circle cx="34" cy="34" r="8" fill="#2563EB" class="pulse"/><text x="54" y="42" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">2. Intelligence</text><text x="26" y="78" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">Turn raw inputs into context, priorities, and decisions.</text><text x="26" y="112" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="17">• Retrieve the right context and classify what matters</text><text x="26" y="140" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="17">• Rank, reason, summarize, and choose the next step</text><text x="26" y="168" fill="#64748B" font-family="Inter,Arial,sans-serif" font-size="16">RAG · ML · Agents · Rules</text></g><g transform="translate(52 378)" filter="url(#shadow)"><rect width="530" height="190" rx="22" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/><circle cx="34" cy="34" r="8" fill="#3B82F6" class="pulse"/><text x="54" y="42" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">3. Action</text><text x="26" y="78" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">Make the system do useful work in the right place.</text><text x="26" y="112" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="17">• Trigger workflows, APIs, applications, or outreach</text><text x="26" y="140" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="17">• Route tasks to tools or people when judgment matters</text><text x="26" y="168" fill="#64748B" font-family="Inter,Arial,sans-serif" font-size="16">Ship · Automate · Orchestrate · Scale</text></g><g transform="translate(618 378)" filter="url(#shadow)"><rect width="530" height="190" rx="22" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/><circle cx="34" cy="34" r="8" fill="#1D4ED8" class="pulse"/><text x="54" y="42" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">4. Feedback</text><text x="26" y="78" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">Measure the outcome, then use it to make the system better.</text><text x="26" y="112" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="17">• Capture analytics, telemetry, and human review</text><text x="26" y="140" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="17">• Refine rules, prompts, models, and workflows</text><text x="26" y="168" fill="#64748B" font-family="Inter,Arial,sans-serif" font-size="16">Measure · Learn · Improve · Compound</text></g><g transform="translate(52 604)"><rect width="1096" height="58" rx="18" fill="#EFF6FF" stroke="#DBEAFE"/><text x="24" y="36" fill="#1E3A8A" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">The goal: move from a clever demo to a dependable system people can use every day.</text></g></svg>