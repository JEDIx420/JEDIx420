<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="1" stop-color="#0E1024"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="135" x2="1080" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pulse { animation: p 3s ease-in-out infinite; }
      .dash { stroke-dasharray: 8 14; animation: d 2.8s linear infinite; }
      @keyframes p {0%,100%{opacity:.48}50%{opacity:1}}
      @keyframes d {to{stroke-dashoffset:-44}}
    </style>
  </defs>
  <rect width="1200" height="270" rx="24" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="268.5" rx="23.25" stroke="#334155" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="56" y="52" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">HOW I THINK ABOUT SYSTEMS</text>
  <text x="56" y="77" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.2">SIGNAL → INTELLIGENCE → ACTION → FEEDBACK</text>

  <path d="M178 149 H1022" stroke="url(#line)" stroke-width="2" stroke-opacity="0.6" class="dash"/>

  <g transform="translate(70 105)">
    <rect width="215" height="92" rx="18" fill="#0F172A" stroke="#155E75"/>
    <circle cx="30" cy="30" r="7" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
    <text x="50" y="35" fill="#A5F3FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">SIGNALS</text>
    <text x="22" y="62" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">web · data · intent · users</text>
    <text x="22" y="80" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">scrape / ingest / enrich / observe</text>
  </g>

  <g transform="translate(330 105)">
    <rect width="215" height="92" rx="18" fill="#0F172A" stroke="#1D4ED8"/>
    <circle cx="30" cy="30" r="7" fill="#60A5FA" filter="url(#glow)" class="pulse"/>
    <text x="50" y="35" fill="#BFDBFE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">INTELLIGENCE</text>
    <text x="22" y="62" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">RAG · ML · agents · rules</text>
    <text x="22" y="80" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">reason / rank / retrieve / decide</text>
  </g>

  <g transform="translate(590 105)">
    <rect width="215" height="92" rx="18" fill="#0F172A" stroke="#6D28D9"/>
    <circle cx="30" cy="30" r="7" fill="#A78BFA" filter="url(#glow)" class="pulse"/>
    <text x="50" y="35" fill="#DDD6FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">ACTION</text>
    <text x="22" y="62" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">apps · APIs · workflows · GTM</text>
    <text x="22" y="80" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">ship / automate / orchestrate / scale</text>
  </g>

  <g transform="translate(850 105)">
    <rect width="280" height="92" rx="18" fill="#0F172A" stroke="#9333EA"/>
    <circle cx="30" cy="30" r="7" fill="#C084FC" filter="url(#glow)" class="pulse"/>
    <text x="50" y="35" fill="#E9D5FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">FEEDBACK LOOPS</text>
    <text x="22" y="62" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">analytics · telemetry · human review</text>
    <text x="22" y="80" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">measure / learn / improve / compound</text>
  </g>

  <circle cx="178" cy="149" r="4" fill="#22D3EE"/>
  <circle cx="438" cy="149" r="4" fill="#60A5FA"/>
  <circle cx="698" cy="149" r="4" fill="#A78BFA"/>
  <circle cx="990" cy="149" r="4" fill="#C084FC"/>
</svg>