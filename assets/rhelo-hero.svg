    <style>.scan{animation:scan 6s linear infinite}.pulse{animation:p 3s ease-in-out infinite}@keyframes scan{0%{transform:translateX(-180px)}100%{transform:translateX(1390px)}}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}</style>
  </defs>

