<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1D4ED8" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2563EB" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="scanFill" x1="0" y1="0" x2="130" y2="0">
      <stop stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0.20"/>
    </linearGradient>
    <style>
      .scan { animation: scan 7s linear infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateX(-150px);} 100% { transform: translateX(1320px);} }
      @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    </style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="24" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="23.25" stroke="#BFDBFE" stroke-width="1.5"/>
  <g class="scan">
    <rect width="130" height="500" fill="url(#scanFill)"/>
    <line x1="128" y1="0" x2="128" y2="500" stroke="#93C5FD" stroke-opacity="0.25"/>
  </g>
  <text x="54" y="58" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">RHELO</text>
  <text x="54" y="88" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="18">Offline-first Bible study and research environment</text>
  <text x="54" y="112" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.1">READ / STUDY / RESEARCH / CAPTURE / EXPORT</text>
  <g transform="translate(54 142)" filter="url(#shadow)">
    <rect width="410" height="286" rx="24" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="26" y="42" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Designed for focused study</text>
    <text x="26" y="74" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="18">Rhelo brings calm reading and serious research into one focused workspace.</text>
    <g transform="translate(26 108)">
      <rect width="162" height="34" rx="17" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="81" y="22" text-anchor="middle" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Scripture reading</text>
    </g>
    <g transform="translate(200 108)">
      <rect width="178" height="34" rx="17" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="89" y="22" text-anchor="middle" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Original languages</text>
    </g>
    <g transform="translate(26 154)">
      <rect width="170" height="34" rx="17" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="85" y="22" text-anchor="middle" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Lexicons and maps</text>
    </g>
    <g transform="translate(208 154)">
      <rect width="170" height="34" rx="17" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="85" y="22" text-anchor="middle" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Sessions and export</text>
    </g>
    <text x="26" y="220" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="17">• aligned English and original-language Scripture</text>
    <text x="26" y="246" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="17">• morphology, dictionaries, and cross-references</text>
    <text x="26" y="272" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="17">• offline speech, native PDF export, and saved sessions</text>
  </g>
  <g transform="translate(506 128)" filter="url(#shadow)">
    <rect width="640" height="312" rx="26" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="0" y="0" width="640" height="46" rx="26" fill="#F8FBFF"/>
    <circle cx="26" cy="23" r="6" fill="#0F172A"/>
    <circle cx="48" cy="23" r="6" fill="#2563EB"/>
    <circle cx="70" cy="23" r="6" fill="#93C5FD"/>
    <text x="96" y="29" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Rhelo Study Workspace</text>
    <rect x="22" y="62" width="235" height="228" rx="18" fill="#F8FBFF" stroke="#DBEAFE"/>
    <text x="38" y="89" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Reading panel</text>
    <text x="38" y="116" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="18">Blessed be the God and Father of our Lord</text>
    <text x="38" y="142" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="18">Jesus Christ, who has blessed us with every</text>
    <text x="38" y="168" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="18">spiritual blessing in the heavenly places...</text>
    <text x="38" y="207" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Parallel Greek</text>
    <text x="38" y="232" fill="#334155" font-family="Times New Roman, serif" font-size="18">Εὐλογητὸς ὁ θεὸς καὶ πατὴρ...</text>
    <text x="38" y="262" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="14">linked verses · word study · audio</text>
    <rect x="275" y="62" width="170" height="228" rx="18" fill="#F8FBFF" stroke="#DBEAFE"/>
    <text x="292" y="89" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Study tools</text>
    <text x="292" y="120" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="16">λεγ-ω</text>
    <text x="292" y="145" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">lemma · verb</text>
    <text x="292" y="173" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="16">Lexicon</text>
    <text x="292" y="196" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">to say, speak, tell, declare</text>
    <text x="292" y="226" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="16">Maps and links</text>
    <text x="292" y="249" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">cross-references · people · places</text>
    <text x="292" y="274" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="14">dictionary · morphology · notes</text>
    <rect x="463" y="62" width="155" height="228" rx="18" fill="#F8FBFF" stroke="#DBEAFE"/>
    <text x="480" y="89" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Research session</text>
    <text x="480" y="116" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="15">• session notes</text>
    <text x="480" y="141" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="15">• drag-and-drop study capture</text>
    <text x="480" y="166" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="15">• saved workspace state</text>
    <text x="480" y="191" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="15">• PDF export</text>
    <text x="480" y="216" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="15">• speech input and playback</text>
    <rect x="480" y="245" width="122" height="28" rx="14" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="541" y="263" text-anchor="middle" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Offline-first</text>
  </g>
  <text x="54" y="464" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17">Under the hood: Next.js + Tauri + Rust + SQLite — a native app architecture designed for dependable study and research.</text>
</svg>