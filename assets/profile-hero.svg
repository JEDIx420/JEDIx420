<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.48" stop-color="#090D1E"/>
      <stop offset="1" stop-color="#11152A"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="90" x2="960" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.48" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 130) rotate(135) scale(330 250)">
      <stop stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 360) rotate(-18) scale(380 180)">
      <stop stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#94A3B8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="420" rx="28"/></clipPath>
    <style>
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 5.5s linear infinite; }
      .floatA { animation: floatA 4.5s ease-in-out infinite; }
      .floatB { animation: floatB 5.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:1} }
      @keyframes scan { 0%{transform:translateX(-260px);opacity:0} 18%{opacity:.55} 82%{opacity:.55} 100%{transform:translateX(1480px);opacity:0} }
      @keyframes floatA { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
      @keyframes floatB { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#glowA)"/>
    <rect width="1200" height="420" fill="url(#glowB)"/>

    <g opacity="0.6">
      <path d="M0 340 C180 288 330 385 532 330 C734 276 832 302 1200 225" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="1.5"/>
      <path d="M0 365 C210 305 350 398 555 344 C780 285 930 318 1200 250" stroke="url(#accent)" stroke-opacity="0.10" stroke-width="1"/>
    </g>

    <g class="scan">
      <rect x="0" y="0" width="170" height="420" fill="url(#accent)" opacity="0.06"/>
      <line x1="168" y1="0" x2="168" y2="420" stroke="#67E8F9" stroke-opacity="0.18"/>
    </g>

    <g transform="translate(865 72)" class="floatA">
      <path d="M20 135 C86 36 199 8 304 92 C242 192 110 214 20 135Z" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="M56 135 C116 78 198 64 265 104 C210 159 123 178 56 135Z" stroke="#67E8F9" stroke-opacity="0.48" stroke-width="1.5"/>
      <ellipse cx="161" cy="126" rx="38" ry="38" stroke="url(#accent)" stroke-width="3"/>
      <ellipse cx="161" cy="126" rx="13" ry="13" fill="#67E8F9" filter="url(#softGlow)" class="pulse"/>
      <path d="M190 121 L246 95 L218 135 L263 150 L194 146" stroke="#C084FC" stroke-opacity="0.72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="92" cy="84" r="3" fill="#60A5FA" class="pulse"/>
      <circle cx="248" cy="181" r="2.5" fill="#C084FC" class="pulse"/>
      <circle cx="284" cy="65" r="2" fill="#67E8F9" class="pulse"/>
      <path d="M92 84 L130 106 M248 181 L205 156 M284 65 L246 94" stroke="#94A3B8" stroke-opacity="0.28"/>
    </g>

    <g transform="translate(66 58)">
      <rect x="0" y="0" width="142" height="30" rx="15" fill="#0F172A" stroke="#334155"/>
      <circle cx="18" cy="15" r="4" fill="#34D399" class="pulse"/>
      <text x="31" y="20" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.8">SYSTEMS ONLINE</text>

      <text x="0" y="106" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="800" font-size="58" letter-spacing="-2.2">JAYANAND J</text>
      <rect x="0" y="128" width="470" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="0" y="172" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Founder &amp; CEO · Eagle Eye Systems</text>
      <text x="0" y="207" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">AI systems · agentic automation · product engineering · GTM infrastructure</text>

      <g transform="translate(0 245)">
        <rect width="132" height="36" rx="18" fill="#0E7490" fill-opacity="0.22" stroke="#22D3EE" stroke-opacity="0.35"/>
        <text x="66" y="23" fill="#A5F3FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AI SYSTEMS</text>
      </g>
      <g transform="translate(145 245)">
        <rect width="174" height="36" rx="18" fill="#1D4ED8" fill-opacity="0.20" stroke="#60A5FA" stroke-opacity="0.35"/>
        <text x="87" y="23" fill="#BFDBFE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AGENTIC AUTOMATION</text>
      </g>
      <g transform="translate(332 245)">
        <rect width="142" height="36" rx="18" fill="#7E22CE" fill-opacity="0.18" stroke="#C084FC" stroke-opacity="0.35"/>
        <text x="71" y="23" fill="#E9D5FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">FULL-STACK</text>
      </g>

      <text x="0" y="338" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">@JEDIx420  /  BUILD → SHIP → AUTOMATE → SCALE</text>
    </g>

    <g opacity="0.7" class="floatB">
      <circle cx="748" cy="76" r="4" fill="#67E8F9" class="pulse"/>
      <circle cx="781" cy="105" r="2" fill="#C084FC" class="pulse"/>
      <circle cx="718" cy="134" r="2.5" fill="#60A5FA" class="pulse"/>
      <path d="M748 76 L781 105 L718 134 L748 76Z" stroke="#94A3B8" stroke-opacity="0.20"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.25" stroke="#334155" stroke-opacity="0.55" stroke-width="1.5"/>
</svg>