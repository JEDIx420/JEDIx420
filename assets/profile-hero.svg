      <stop offset="1" stop-color="#F2F7FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="84" x2="1090" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 154) rotate(138) scale(320 220)">
      <stop stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
